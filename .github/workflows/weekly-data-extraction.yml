# Weekly incremental data pipeline.
#
# The workflow is deliberately thin: completeness, idempotency, locking,
# and atomic publication are enforced by the pipeline itself against the
# database (see scripts/incremental_load.py). Season gating lives in
# Python, not bash. The advisory lock - not the concurrency group - is
# the real serialization; the group is politeness for the Actions UI.
#
# Schedules:
#   - Tuesdays 08:00 America/Denver, Sep-Jan: the weekly load, after
#     Monday Night Football has settled. Cron is UTC-only and ignores
#     daylight saving, so both candidate hours are scheduled (14:00 UTC =
#     08:00 MDT, 15:00 UTC = 08:00 MST) and --require-local-hour lets
#     exactly one through; the other exits in seconds having touched
#     nothing. Completeness comes from each week's own Yahoo scoreboard
#     status, not from current_week, so a finished week is never read as
#     in-progress just because Yahoo has not advanced the season pointer
#     yet. Stat corrections land Tue-Thu and are picked up by the rolling
#     two-week re-load on subsequent runs.
#   - 1st of every month 15:00 UTC, year-round: heartbeat. Exercises the
#     OAuth refresh token so it survives the Feb-Jul quiet months, and
#     pushes a dated heartbeat commit so GitHub's 60-day inactivity
#     auto-disable never fires (scheduled runs alone do not count as
#     repository activity).
#
# Failure alerting: a GitHub issue per failed run. The dead-man's check
# (nothing ran at all) deliberately does NOT live in this repository's
# scheduled workflows - it must sit outside this failure domain; see
# scripts/staleness_check.py.

name: Weekly Data Pipeline

on:
  schedule:
    - cron: '0 14 * 9,10,11,12,1 2'   # Tuesdays Sep-Jan, 08:00 MDT
    - cron: '0 15 * 9,10,11,12,1 2'   # Tuesdays Sep-Jan, 08:00 MST
    - cron: '0 15 1 * *'              # monthly: heartbeat + keepalive
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to load (repair runs), e.g. 2007'
        required: false
      weeks:
        description: 'Space-separated weeks (repair runs), e.g. "15 16"'
        required: false
      stats_only:
        description: 'Statistics only'
        type: boolean
        default: false

concurrency:
  group: weekly-load
  cancel-in-progress: false

permissions:
  contents: write   # heartbeat commit
  issues: write     # failure alerts

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Yahoo credentials
        env:
          YAHOO_CLIENT_KEY: ${{ secrets.YAHOO_CLIENT_KEY }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          # yahoo_oauth takes its non-interactive refresh path only when
          # access_token AND token_type AND refresh_token are all truthy;
          # token_time 0 forces the refresh. An empty access_token here is
          # what stranded the old pipeline in an interactive input() call.
          cat > oauth2.json << EOF
          {
            "access_token": "placeholder-refresh-me",
            "token_type": "bearer",
            "refresh_token": "$YAHOO_REFRESH_TOKEN",
            "consumer_key": "$YAHOO_CLIENT_KEY",
            "consumer_secret": "$YAHOO_CLIENT_SECRET",
            "token_time": 0
          }
          EOF

      - name: Heartbeat (monthly schedule only)
        if: github.event_name == 'schedule' && github.event.schedule == '0 15 1 * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Exercises token refresh + prints the gap; loads nothing.
          python scripts/incremental_load.py --dry-run --force
          # Repo-activity keepalive against the 60-day scheduled-workflow
          # auto-disable.
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat
          git config user.name "pipeline-heartbeat"
          git config user.email "actions@github.com"
          git add .github/heartbeat
          git commit -m "Pipeline heartbeat [skip ci]" || true
          git push || true

      - name: Weekly load
        if: github.event_name != 'schedule' || github.event.schedule != '0 15 1 * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season ${{ inputs.season }}"; fi
          if [ -n "${{ inputs.weeks }}" ]; then ARGS="$ARGS --weeks ${{ inputs.weeks }}"; fi
          if [ "${{ inputs.stats_only }}" = "true" ]; then ARGS="$ARGS --stats-only"; fi
          # Only the scheduled pair is DST-gated; a manual dispatch runs now.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --require-local-hour 8 --local-tz America/Denver"
          fi
          python scripts/incremental_load.py $ARGS

      - name: Upload run snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-snapshot-${{ github.run_number }}
          path: data/runs/*.json.gz
          if-no-files-found: ignore
          retention-days: 90

      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Weekly data pipeline failed (run #${{ github.run_number }})" \
            --body "The scheduled pipeline run failed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Trigger: ${{ github.event_name }}

          The pipeline is self-healing: once the cause is fixed, the next run loads every missing period automatically. Check the run log for the error tail; 'pipeline_runs' in the database holds the failure record." \
            --label bug || true
