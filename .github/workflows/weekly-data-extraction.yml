# Weekly incremental data pipeline.
#
# The workflow is deliberately thin: completeness, idempotency, locking,
# and atomic publication are enforced by the pipeline itself against the
# database (see scripts/incremental_load.py). Season gating lives in
# Python, not bash. The advisory lock - not the concurrency group - is
# the real serialization; the group is politeness for the Actions UI.
#
# Schedules:
#   - Tuesdays 08:00 America/Denver, Sep-Jan: the weekly load, after
#     Monday Night Football has settled. Cron is UTC-only and ignores
#     daylight saving, so both candidate hours are scheduled (14:00 UTC =
#     08:00 MDT, 15:00 UTC = 08:00 MST) and --require-local-hour lets
#     exactly one through; the other exits in seconds having touched
#     nothing. The gate judges which entry fired (github.event.schedule),
#     not the clock when the run starts, so a run GitHub delays still
#     loads. Completeness comes from each week's own Yahoo scoreboard
#     status, not from current_week, so a finished week is never read as
#     in-progress just because Yahoo has not advanced the season pointer
#     yet. Stat corrections land Tue-Thu and are picked up by the rolling
#     two-week re-load on subsequent runs.
#   - 1st of every month 15:00 UTC, year-round: heartbeat. Exercises the
#     OAuth refresh token so it survives the Feb-Jul quiet months, and
#     pushes a dated heartbeat commit so GitHub's 60-day inactivity
#     auto-disable never fires (scheduled runs alone do not count as
#     repository activity).
#
# Failure alerting: a GitHub issue per failed run. The dead-man's check
# (nothing ran at all) deliberately does NOT live in this repository's
# scheduled workflows - it must sit outside this failure domain; see
# scripts/staleness_check.py.

name: Weekly Data Pipeline

on:
  # Re-enabling a workflow GitHub auto-disabled for inactivity does not always
  # re-register its schedule: after the 2026-09-16 re-enable it showed
  # "active" but no scheduled run fired (9/22, 9/29, the Oct 1 heartbeat,
  # 10/6). A push that changes this file on main re-registers it. If scheduled
  # runs stop again while the workflow reads "active", re-save this file.
  schedule:
    - cron: '0 14 * 9,10,11,12,1 2'   # Tuesdays Sep-Jan, 08:00 MDT
    - cron: '0 15 * 9,10,11,12,1 2'   # Tuesdays Sep-Jan, 08:00 MST
    - cron: '0 15 1 * *'              # monthly: heartbeat + keepalive
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to load (repair runs), e.g. 2007'
        required: false
      weeks:
        description: 'Space-separated weeks (repair runs), e.g. "15 16"'
        required: false
      stats_only:
        description: 'Statistics only'
        type: boolean
        default: false

concurrency:
  group: weekly-load
  cancel-in-progress: false

permissions:
  contents: write   # heartbeat commit
  issues: write     # failure alerts

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Yahoo credentials
        env:
          YAHOO_CLIENT_KEY: ${{ secrets.YAHOO_CLIENT_KEY }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          # yahoo_oauth takes its non-interactive refresh path only when
          # access_token AND token_type AND refresh_token are all truthy;
          # token_time 0 forces the refresh. An empty access_token here is
          # what stranded the old pipeline in an interactive input() call.
          cat > oauth2.json << EOF
          {
            "access_token": "placeholder-refresh-me",
            "token_type": "bearer",
            "refresh_token": "$YAHOO_REFRESH_TOKEN",
            "consumer_key": "$YAHOO_CLIENT_KEY",
            "consumer_secret": "$YAHOO_CLIENT_SECRET",
            "token_time": 0
          }
          EOF

      - name: Heartbeat (monthly schedule only)
        if: github.event_name == 'schedule' && github.event.schedule == '0 15 1 * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Exercises token refresh + prints the gap; loads nothing.
          python scripts/incremental_load.py --dry-run --force
          # Repo-activity keepalive against the 60-day scheduled-workflow
          # auto-disable.
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat
          git config user.name "pipeline-heartbeat"
          git config user.email "actions@github.com"
          git add .github/heartbeat
          git commit -m "Pipeline heartbeat [skip ci]" || true
          git push || true

      - name: Weekly load
        id: load
        if: github.event_name != 'schedule' || github.event.schedule != '0 15 1 * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The cron entry that triggered this run (empty for manual runs).
          # Passed as env, not in ARGS: it contains spaces and ARGS is split.
          SCHEDULED_CRON: ${{ github.event.schedule }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season ${{ inputs.season }}"; fi
          if [ -n "${{ inputs.weeks }}" ]; then ARGS="$ARGS --weeks ${{ inputs.weeks }}"; fi
          if [ "${{ inputs.stats_only }}" = "true" ]; then ARGS="$ARGS --stats-only"; fi
          # Only the scheduled pair is DST-gated; a manual dispatch runs now.
          # The gate judges the slot SCHEDULED_CRON names, not the start-up
          # clock: GitHub can start a scheduled run hours late (2026-10-13).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --require-local-hour 8 --local-tz America/Denver"
          fi
          python scripts/incremental_load.py $ARGS

      # Saves the week's playoff-odds forecast (model.playoff_odds_snapshots,
      # migration 015) so it can be graded later. It runs the site's own odds
      # code, so it needs the web app's dependencies. Idempotent: a run that
      # loaded nothing new saves nothing. Node 24 matches the Mac that rebuilds
      # past seasons, so both compute the same model version
      # (web/src/lib/server/playoff-odds-version.ts).
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || github.event.schedule != '0 15 1 * *'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Installed in its own step, without the database secret, and with no
      # install scripts: a script could otherwise rewrite node_modules for the
      # next step to run with the secret. Only esbuild and @tailwindcss/oxide
      # have install scripts, and both get their binaries from optional
      # dependencies without them.
      - name: Install web dependencies
        if: github.event_name != 'schedule' || github.event.schedule != '0 15 1 * *'
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Snapshot playoff odds
        id: snapshot
        if: github.event_name != 'schedule' || github.event.schedule != '0 15 1 * *'
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run odds:snapshot

      - name: Upload run snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-snapshot-${{ github.run_number }}
          path: data/runs/*.json.gz
          if-no-files-found: ignore
          retention-days: 90

      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LOAD_OUTCOME: ${{ steps.load.outcome }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The load succeeded and the snapshot didn't finish: it failed, or
          # setup-node or the install before it failed and it was skipped.
          if [ "$LOAD_OUTCOME" = "success" ] && [ "$SNAPSHOT_OUTCOME" != "success" ]; then
            TITLE="Playoff-odds snapshot failed (run #${{ github.run_number }})"
            BODY="The weekly load succeeded, but saving the playoff-odds snapshot failed.

          Run: $RUN_URL
          Trigger: ${{ github.event_name }}

          The site is fine; only the saved forecast is missing. Fix the cause and re-run the workflow before the next game kicks off to save this week's forecast as live. After that it can only come back as a rebuild (captured_live = false). Check the log of the step that failed (setup-node, Install web dependencies or Snapshot playoff odds)."
          elif [ "$LOAD_OUTCOME" = "success" ]; then
            TITLE="Weekly pipeline step failed after a good load (run #${{ github.run_number }})"
            BODY="The weekly load and the playoff-odds snapshot both succeeded, but a later step failed.

          Run: $RUN_URL
          Trigger: ${{ github.event_name }}

          The data and the saved forecast are fine. Check the log of the step that failed (most likely Upload run snapshot)."
          else
            TITLE="Weekly data pipeline failed (run #${{ github.run_number }})"
            BODY="The scheduled pipeline run failed.

          Run: $RUN_URL
          Trigger: ${{ github.event_name }}

          The pipeline is self-healing: once the cause is fixed, the next run loads every missing period automatically. Check the run log for the error tail; 'pipeline_runs' in the database holds the failure record."
          fi
          gh issue create --title "$TITLE" --body "$BODY" --label bug || true
