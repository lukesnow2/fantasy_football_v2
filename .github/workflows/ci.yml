# Test suite. The Python pipeline tests run against a real Postgres
# service because the guarantees under test (advisory locks, transactional
# flag commits, schema-rename restore) are database behaviors.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: runner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline tests
        env:
          PGHOST: localhost
          PGUSER: runner
        run: python -m pytest tests/ -q

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        # The client half of the suite runs in vitest browser mode, which
        # drives a real Chromium. Without this the run dies before any test
        # executes, reporting only "failed to scan for dependencies".
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm run test:unit -- --run
