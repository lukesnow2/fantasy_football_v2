<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Fantasy Football Trophy</title>
  <!-- Trophy base -->
  <rect x="8" y="24" width="16" height="2" fill="#FFD700" stroke="#B8860B" stroke-width="0.5"/>
  <rect x="10" y="22" width="12" height="2" fill="#FFD700" stroke="#B8860B" stroke-width="0.5"/>
  
  <!-- Trophy cup -->
  <path d="M6 8 L6 22 Q6 24 8 24 L24 24 Q26 24 26 22 L26 8 Z" fill="#FFD700" stroke="#B8860B" stroke-width="0.5"/>
  
  <!-- Trophy handles -->
  <path d="M6 12 Q4 12 4 14 Q4 16 6 16" fill="none" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M26 12 Q28 12 28 14 Q28 16 26 16" fill="none" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Trophy top -->
  <rect x="12" y="6" width="8" height="2" fill="#FFD700" stroke="#B8860B" stroke-width="0.5"/>
  <rect x="14" y="4" width="4" height="2" fill="#FFD700" stroke="#B8860B" stroke-width="0.5"/>
  
  <!-- Shine effect -->
  <path d="M8 10 L10 10 L10 20 L8 20 Z" fill="#FFF8DC" opacity="0.6"/>
</svg>